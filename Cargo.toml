[workspace]
resolver = "3"
members = ["city", "prep"]

[workspace.package]
version = "0.1.0"
authors = ["Francisco Jiménez <jjcfrank@gmail.com>"]
edition = "2024"
# Set by overrules (opening-hours needs it).
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jjcfrancisco/overrules-city"
publish = false

[workspace.dependencies]
overrules = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1"
geo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen CLI (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.123"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Browser build: small and fast to download.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
